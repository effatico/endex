name: Release

# Triggered by pushing a version tag:  git tag v0.2.0 && git push --tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub Release + upload assets

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
          # Intel Macs: cross-compiled from Apple Silicon runners (macos-13
          # runners are deprecated/unavailable on many plans).
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Cross-linker for aarch64-linux
      - name: Install cross toolchain (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
        # ureq/rustls is pure Rust, so no extra sysroot deps are needed.

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/endex
          PKG=endex-${{ matrix.target }}
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp "$BIN.exe" endex.exe
            7z a "$PKG.zip" endex.exe README.md LICENSE
            echo "asset=$PKG.zip" >> "$GITHUB_ENV"
          else
            cp "$BIN" endex
            tar -czf "$PKG.tar.gz" endex README.md LICENSE
            echo "asset=$PKG.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.asset }}
            ${{ env.asset }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
